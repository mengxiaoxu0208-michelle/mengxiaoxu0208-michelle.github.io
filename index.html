<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111311" />
    <meta name="description" content="Michelle 的个人影像作品集，分享影视作品、创作过程与项目中的思考。" />
    <title>Michelle · 影像作品集</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="portfolio-data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到主要内容</a>

    <header class="site-header page-width">
      <a class="wordmark js-display-name" href="#top" aria-label="Michelle · 回到首页">MICHELLE.</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#work">作品</a>
        <a href="#about">关于</a>
        <a href="#contact">联系</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero page-width" id="top" aria-labelledby="hero-title">
        <figure class="hero__visual">
          <img src="./coast.webp" alt="AI 生成的海岸氛围图：一个人沿着海边山坡上的小路，走向远处朦胧的群山。" width="1536" height="1024" fetchpriority="high" />
          <figcaption>氛围视觉 · AI 生成</figcaption>
        </figure>
        <div class="hero__content">
          <h1 id="hero-title"><span>分镜之间，</span><span>让故事发生。</span></h1>
          <p class="hero__intro js-intro">用影像留住感受，用故事连接彼此。</p>
          <a class="browse-link" href="#work">
            <span>浏览作品</span>
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7" /></svg>
          </a>
        </div>
        <p class="hero__eyebrow">影像创作 · 个人作品集</p>
      </section>

      <section class="work-section page-width reveal" id="work" aria-labelledby="work-title">
        <div class="section-heading">
          <h2 id="work-title">精选作品</h2>
          <p class="section-heading__english" lang="en">Selected Work</p>
        </div>
        <div class="work-empty" id="work-empty">
          <p class="work-empty__title">作品正在整理中。</p>
          <p>新的影像故事，即将在这里呈现。</p>
        </div>
        <div class="project-list" id="project-list" hidden></div>
      </section>

      <section class="about-section page-width reveal" id="about" aria-labelledby="about-title">
        <h2 id="about-title">关于我</h2>
        <div class="about-section__body">
          <p class="about-section__statement">我是 <span class="js-name">Michelle</span>，<br />以影像记录观察。</p>
          <p class="about-section__description">这里将分享我的影视作品、创作过程与项目中的思考。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer page-width reveal" id="contact" aria-labelledby="contact-title">
      <div class="site-footer__top">
        <h2 id="contact-title">一起，讲一个好故事。</h2>
        <a class="contact-link js-github-link" href="https://github.com/mengxiaoxu0208-michelle" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开 Michelle 的 GitHub 主页">
          <span lang="en">GitHub</span>
          <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10" /></svg>
        </a>
      </div>
      <p class="copyright">© 2026 <span class="js-name">Michelle</span>.</p>
    </footer>
  </body>
</html>
